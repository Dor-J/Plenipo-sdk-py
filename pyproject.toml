[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plenipo-mcp"
version = "0.0.1"
description = "Plenipo MCP skill and Python client for agent-to-agent communication"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.6.0",
  "httpx>=0.28.0",
  "pynacl>=1.5.0",
  "websockets>=14.0",
  "base58>=2.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=7.0.0",
  "pip-audit>=2.7.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[project.scripts]
plenipo-mcp = "plenipo.mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["plenipo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
